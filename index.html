  <script>
    (function() {
      try {
        var saved = localStorage.getItem('colornote_settings');
        var isDark = true;
        if (saved) {
          var parsed = JSON.parse(saved);
          if (parsed.theme === 'light') isDark = false;
          else if (parsed.theme === 'dark') isDark = true;
          else if (window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches) isDark = false;
        } else if (window.matchMedia && !window.matchMedia('(prefers-color-scheme: dark)').matches) {
          isDark = false;
        }
        var bg = isDark ? '#0f172a' : '#f8fafc';
        document.documentElement.className = isDark ? 'dark' : 'light';
        document.documentElement.style.backgroundColor = bg;
      } catch(e) {}
    })();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var r of registrations) { r.unregister(); }
      });
    }
  </script>

    function calculateEaster(year) {
      const a = year % 19, b = Math.floor(year / 100), c = year % 100, d = Math.floor(b / 4), e = b % 4;
      const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31);
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      return new Date(year, month - 1, day);
    }

        return day - ((dow - targetWeekday + 7) % 7);

      const first = new Date(year, monthIndex, 1);
      const dow = first.getDay();
      return 1 + ((targetWeekday - dow + 7) % 7) + (n - 1) * 7;

    function playToneSound(toneName = 'classic') {
      try {
        const ctx = getUnlockedAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        if (toneName === 'bell') {
          [{ freq: 880, gain: 0.35, decay: 1.2 }, { freq: 1760, gain: 0.16, decay: 0.8 }, { freq: 2640, gain: 0.08, decay: 0.5 }].forEach(h => {
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(h.freq, now);
            gain.gain.setValueAtTime(h.gain, now); gain.gain.exponentialRampToValueAtTime(0.0001, now + h.decay);
            osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now + h.decay + 0.05);
          });
        } else if (toneName === 'digital') {
          [0, 0.11, 0.22].forEach(offset => {
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(1046.50, now + offset);
            gain.gain.setValueAtTime(0.18, now + offset); gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.07);
            osc.connect(gain); gain.connect(ctx.destination); osc.start(now + offset); osc.stop(now + offset + 0.08);
          });
        } else if (toneName === 'soft') {
          [440, 554.37, 659.25].forEach((freq, idx) => {
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(freq, now + idx * 0.16);
            gain.gain.setValueAtTime(0.001, now + idx * 0.16); gain.gain.linearRampToValueAtTime(0.22, now + idx * 0.16 + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.16 + 0.7);
            osc.connect(gain); gain.connect(ctx.destination); osc.start(now + idx * 0.16); osc.stop(now + idx * 0.16 + 0.75);
          });
        } else if (toneName === 'harmonic') {
          [432, 540, 648, 864].forEach((freq, i) => {
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = i % 2 === 0 ? 'sine' : 'triangle'; osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.001, now); gain.gain.linearRampToValueAtTime(0.11, now + 0.06);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.15);
            osc.connect(gain); gain.connect(ctx.destination); osc.start(now); osc.stop(now + 1.2);
          });
        } else {
          [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, now + idx * 0.13);
            gain.gain.setValueAtTime(0.32, now + idx * 0.13); gain.gain.exponentialRampToValueAtTime(0.0001, now + idx * 0.13 + 0.6);
            osc.connect(gain); gain.connect(ctx.destination); osc.start(now + idx * 0.13); osc.stop(now + idx * 0.13 + 0.65);
          });
        }
      } catch (e) { console.warn('Tone playback error:', e); }
    }

        roomKeys.forEach(roomKey => {
          const notesRef = rtdb.ref('colornote_rooms/' + roomKey + '/notes');

          const onValue = notesRef.on('value', (snap) => {
            const val = snap.val();
            if (!val || typeof val !== 'object') return;
            const remoteNotes = Object.values(val).filter(n => n && (n.isShared || n.is_shared));
            if (remoteNotes.length === 0) return;
            setNotes(prev => {
              const map = new Map();
              prev.forEach(n => map.set(n.id, n));
              let changed = false;
              remoteNotes.forEach(rn => {
                const local = map.get(rn.id);
                if (!local) { map.set(rn.id, rn); changed = true; }
                else if ((Number(rn.updatedAt) || 0) > (Number(local.updatedAt) || 0)) { map.set(rn.id, { ...local, ...rn }); changed = true; }

              const local = prev.find(n => n.id === remote.id);

      const handleAttachFile = (mode = 'all') => {
        const input = document.createElement('input');
        input.type = 'file';
        if (mode === 'image') input.accept = 'image/*';
        else input.accept = 'image/*,application/pdf,text/*,.doc,.docx,.xls,.xlsx,.zip,audio/*';
        input.onchange = (e) => {
          if (e) { if (typeof e.preventDefault === 'function') e.preventDefault(); if (typeof e.stopPropagation === 'function') e.stopPropagation(); }
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          if (!file.type.startsWith('image/') && file.size > 3 * 1024 * 1024) {
            showToast(settings.language === 'en' ? '⚠️ File too large (max 3 MB)' : '⚠️ Archivo muy pesado (máximo 3 MB)');
            return;
          }
          const isImg = file.type && file.type.startsWith('image/');
          const reader = new FileReader();
          reader.onload = (ev) => {
            const rawData = ev.target.result;
            if (isImg) {
              const img = new Image();
              img.onload = () => {
                try {
                  const maxDim = 960;
                  let w = img.width || maxDim;
                  let h = img.height || maxDim;
                  if (w > maxDim || h > maxDim) {
                    if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                    else { w = Math.round((w * maxDim) / h); h = maxDim; }
                  }
                  const canvas = document.createElement('canvas');
                  canvas.width = w; canvas.height = h;
                  const ctx = canvas.getContext('2d');
                  if (!ctx) throw new Error('Canvas 2D context error');
                  ctx.drawImage(img, 0, 0, w, h);
                  const compressed = canvas.toDataURL('image/jpeg', 0.72);
                  setEditingNote(prev => {
                    if (!prev) return prev;
                    const curAtts = Array.isArray(prev.attachments) ? prev.attachments : [];
                    return { ...prev, attachments: [...curAtts, { id: 'att_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4), type: 'image', data: compressed, name: file.name || 'foto.jpg', size: compressed.length }] };
                  });
                  showToast(settings.language === 'en' ? '📷 Photo attached successfully' : '📷 Foto adjuntada con éxito');
                } catch (cErr) {
                  console.warn('Canvas compression fallback:', cErr);
                  if (file.size < 600 * 1024) {
                    setEditingNote(prev => {
                      if (!prev) return prev;
                      const curAtts = Array.isArray(prev.attachments) ? prev.attachments : [];
                      return { ...prev, attachments: [...curAtts, { id: 'att_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4), type: 'image', data: rawData, name: file.name || 'foto.jpg', size: file.size }] };
                    });
                    showToast(settings.language === 'en' ? '📷 Photo attached' : '📷 Foto adjuntada');
                  } else showToast(settings.language === 'en' ? '⚠️ Image too large to process' : '⚠️ Imagen demasiado pesada');
                }
              };
              img.onerror = () => { showToast(settings.language === 'en' ? '❌ Error loading image' : '❌ Error al cargar la imagen'); };
              img.src = rawData;
            } else {
              setEditingNote(prev => {
                if (!prev) return prev;
                const curAtts = Array.isArray(prev.attachments) ? prev.attachments : [];
                return { ...prev, attachments: [...curAtts, { id: 'file_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4), type: 'file', data: rawData, name: file.name || 'documento', size: file.size, mimeType: file.type }] };
              });
              showToast(settings.language === 'en' ? `📎 File "${file.name}" attached` : `📎 Archivo "${file.name}" adjuntado`);
            }
          };
          reader.onerror = (err) => { console.error('FileReader error:', err); showToast(settings.language === 'en' ? '❌ Error loading file' : '❌ Error al cargar el archivo'); };
          reader.readAsDataURL(file);
        };
        input.click();
      };

      const toggleVoiceDictation = async () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert('❌ El reconocimiento de voz no está soportado por este navegador/WebView.\n\nIntenta usar Chrome en Android o Safari en iOS.');
          showToast(t('voiceNotSupported'));
          return;
        }

        if (isDictating) {
          try {
            if (speechRecognitionRef.current) {
              speechRecognitionRef.current.stop();
              speechRecognitionRef.current.abort();
            }
          } catch (e) {}
          setIsDictating(false);
          return;
        }

        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert('❌ Este dispositivo/navegador no soporta el acceso al micrófono (getUserMedia).\n\nRevisa los permisos de la app en los ajustes del sistema.');
            showToast(t('audioRecordingBlocked'));
            return;
          }
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(t => t.stop());
        } catch (permErr) {
          console.warn('Mic permission error:', permErr);
          const errName = permErr && permErr.name ? permErr.name : 'Error';
          if (errName === 'NotAllowedError' || errName === 'PermissionDeniedError') {
            alert('❌ Acceso al micrófono DENEGADO.\n\nDebes permitir el micrófono en los ajustes del navegador/WebView o de la app en tu teléfono.\n\nEjecuta la app bajo HTTPS o revisa los permisos del APK.');
            showToast(t('micPermissionDenied'));
          } else if (errName === 'NotFoundError' || errName === 'DevicesNotFoundError') {
            alert('❌ No se encontró ningún micrófono en este dispositivo.');
            showToast(t('audioRecordingError'));
          } else {
            alert('❌ Error al acceder al micrófono: ' + errName + '\n\n' + (permErr.message || ''));
            showToast(t('audioRecordingBlocked'));
          }
          return;
        }

        try {
          const recognition = new SpeechRecognition();
          recognition.lang = settings.language === 'en' ? 'en-US' : 'es-ES';
          recognition.continuous = false;
          recognition.interimResults = false;
          recognition.maxAlternatives = 1;

          recognition.onstart = () => { setIsDictating(true); showToast(t('voiceListening')); };
          recognition.onresult = (event) => {
            try {
              const transcript = event.results[0][0].transcript;
              if (transcript && transcript.trim()) {
                setEditingNote(prev => prev ? ({ ...prev, content: (prev.content ? prev.content + ' ' : '') + transcript.trim() }) : prev);
                showToast(t('textAdded'));
              }
            } catch (err) { console.warn('Voice result error:', err); }
          };
          recognition.onerror = (event) => {
            console.warn('Speech recognition error:', event.error);
            setIsDictating(false);
            if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
              alert('❌ El reconocimiento de voz fue BLOQUEADO.\n\nVerifica que el micrófono esté permitido para esta app/navegador.');
              showToast(t('micPermissionDenied'));
            } else if (event.error === 'no-speech') {
              showToast('🎙️ No se detectó voz. Intenta de nuevo.');
            } else if (event.error !== 'aborted') {
              alert('❌ Error en el reconocimiento de voz: ' + event.error);
              showToast(t('voiceRecognitionError'));
            }
          };
          recognition.onend = () => { setIsDictating(false); };
          speechRecognitionRef.current = recognition;
          recognition.start();
        } catch (err) {
          console.warn('Speech recognition start error:', err);
          setIsDictating(false);
          alert('❌ No se pudo iniciar el dictado por voz:\n' + (err.message || err));
          showToast(t('voiceRecognitionError'));
        }
      };

      const startAudioRecording = async () => {
        if (isRecordingAudio) { stopAudioRecording(); return; }
        try {
          if (typeof MediaRecorder === 'undefined') {
            alert('❌ Este navegador/WebView no soporta la grabación de audio (MediaRecorder no disponible).');
            showToast(t('audioRecordingError'));
            return;
          }
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert('❌ Este dispositivo/navegador no soporta el acceso al micrófono (getUserMedia).\n\nRevisa los permisos de la app en los ajustes del sistema.');
            showToast(t('audioRecordingBlocked'));
            return;
          }

          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioStreamRef.current = stream;
          const mimeType = (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/webm'))
            ? 'audio/webm'
            : (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/mp4'))
              ? 'audio/mp4'
              : '';
          const mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
          mediaRecorderRef.current = mediaRecorder;
          audioChunksRef.current = [];

          mediaRecorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) audioChunksRef.current.push(e.data); };
          mediaRecorder.onerror = (e) => {
            console.warn('MediaRecorder error:', e);
            setIsRecordingAudio(false);
            if (audioStreamRef.current) { audioStreamRef.current.getTracks().forEach(t => t.stop()); audioStreamRef.current = null; }
            clearInterval(recordTimerRef.current);
            alert('❌ Error durante la grabación de audio.');
            showToast(t('audioRecordingError'));
          };
          mediaRecorder.onstop = () => {
            try {
              const chunks = audioChunksRef.current;
              if (!chunks || chunks.length === 0) {
                setIsRecordingAudio(false);
                if (audioStreamRef.current) { audioStreamRef.current.getTracks().forEach(t => t.stop()); audioStreamRef.current = null; }
                clearInterval(recordTimerRef.current);
                return;
              }
              const usedType = mediaRecorder.mimeType || mimeType || 'audio/webm';
              const audioBlob = new Blob(chunks, { type: usedType });
              const reader = new FileReader();
              reader.onload = (ev) => {
                const base64Audio = ev.target.result;
                setEditingNote(prev => prev ? ({ ...prev, attachments: [...(prev.attachments || []), { id: 'aud_' + Date.now(), type: 'audio', data: base64Audio, duration: recordingSeconds, mimeType: usedType }] }) : null);
                showToast('🎙️ ' + t('voiceNote'));
              };
              reader.onerror = () => showToast(t('audioRecordingError'));
              reader.readAsDataURL(audioBlob);
            } catch (err) {
              console.warn('Audio save error:', err);
              showToast(t('audioRecordingError'));
            } finally {
              if (audioStreamRef.current) { audioStreamRef.current.getTracks().forEach(t => t.stop()); audioStreamRef.current = null; }
              clearInterval(recordTimerRef.current);
              setRecordingSeconds(0);
              setIsRecordingAudio(false);
            }
          };

          mediaRecorder.start(200);
          setIsRecordingAudio(true);
          setRecordingSeconds(0);
          recordTimerRef.current = setInterval(() => { setRecordingSeconds(s => s + 1); }, 1000);
        } catch (err) {
          console.warn('getUserMedia error:', err);
          const errName = err && err.name ? err.name : 'Error';
          if (errName === 'NotAllowedError' || errName === 'PermissionDeniedError') {
            alert('❌ Acceso al micrófono DENEGADO.\n\nDebes permitir el micrófono en los ajustes del navegador/WebView o de la app en tu teléfono.\n\nEjecuta la app bajo HTTPS o revisa los permisos del APK.');
            showToast(t('micPermissionDenied'));
          } else if (errName === 'NotFoundError' || errName === 'DevicesNotFoundError') {
            alert('❌ No se encontró ningún micrófono en este dispositivo.');
            showToast(t('audioRecordingError'));
          } else {
            alert('❌ Error al acceder al micrófono: ' + errName + '\n\n' + (err.message || ''));
            showToast(t('audioRecordingError'));
          }
          setIsRecordingAudio(false);
        }
      };

      const stopAudioRecording = () => {
        try {
          if (mediaRecorderRef.current && isRecordingAudio) {
            if (mediaRecorderRef.current.state !== 'inactive') mediaRecorderRef.current.stop();
          }
        } catch (e) { console.warn('Stop recording error:', e); }
      };

      const openDrawingModal = () => {
        setShowDrawingModal(true);
        setTimeout(() => {
          const canvas = drawingCanvasRef.current;
          if (canvas) {
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
          }
        }, 100);
      };

      const startDrawing = (e) => {
        isDrawingRef.current = true;
        const canvas = drawingCanvasRef.current;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        ctx.beginPath();
        ctx.moveTo(clientX - rect.left, clientY - rect.top);
      };

      const drawMove = (e) => {
        if (!isDrawingRef.current) return;
        const canvas = drawingCanvasRef.current;
        const ctx = canvas.getContext('2d');
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        ctx.strokeStyle = drawingColor;
        ctx.lineWidth = drawingLineWidth;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.lineTo(clientX - rect.left, clientY - rect.top);
        ctx.stroke();
      };

      const stopDrawing = () => { isDrawingRef.current = false; };

      const saveDrawing = () => {
        const canvas = drawingCanvasRef.current;
        if (!canvas) return;
        const dataUrl = canvas.toDataURL('image/png');
        setEditingNote(prev => prev ? ({ ...prev, attachments: [...(prev.attachments || []), { id: 'draw_' + Date.now(), type: 'image', data: dataUrl, name: 'Boceto' }] }) : null);
        setShowDrawingModal(false);
        showToast('🎨 Boceto guardado en la nota');
      };

      const readNoteAloud = (text) => {
        if (!('speechSynthesis' in window)) { showToast('❌ Síntesis de voz no disponible'); return; }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = settings.language === 'en' ? 'en-US' : 'es-ES';
        window.speechSynthesis.speak(utterance);
        showToast('🗣️ Leyendo nota...');
      };

      const addCurrentLocation = () => {
        if (!navigator.geolocation) { showToast('❌ Geolocalización no disponible'); return; }
        showToast('📍 Obteniendo ubicación...');
        navigator.geolocation.getCurrentPosition(
          async (pos) => {
            const lat = pos.coords.latitude.toFixed(5);
            const lng = pos.coords.longitude.toFixed(5);
            const locText = `\n📍 Ubicación: https://maps.google.com/?q=${lat},${lng}`;
            setEditingNote(prev => prev ? ({ ...prev, content: (prev.content || '') + locText }) : null);
            showToast('📍 Ubicación añadida');
          },
          () => showToast('❌ No se pudo obtener la ubicación')
        );
      };

      const shareNote = (note) => {
        const textToShare = `${note.title || 'SmartNote DJ'}\n\n${note.content || ''}`;
        if (navigator.share) navigator.share({ title: note.title || 'SmartNote DJ', text: textToShare }).catch(() => {});
        else { navigator.clipboard.writeText(textToShare); showToast('📋 Copiado al portapapeles'); }
      };

      const printNote = (note) => {
        try {
          if (!note) return;
          const title = note.title || 'Sin título';
          let bodyHtml = '';
          if (note.type === 'checklist') {
            bodyHtml = '<ul style="list-style:none;padding:0;">' + (note.checklist || []).map(item =>
              `<li style="margin:6px 0;font-size:15px;">${item.completed ? '☑' : '☐'} <span style="${item.completed ? 'text-decoration:line-through;opacity:0.6;' : ''}">${(item.text || '').replace(/</g,'&lt;')}</span></li>`
            ).join('') + '</ul>';
          } else {
            const content = (note.content || '').replace(/</g,'&lt;').replace(/\n/g, '<br/>');
            bodyHtml = `<p style="font-size:15px;line-height:1.6;white-space:pre-wrap;">${content || '<em>(Nota vacía)</em>'}</p>`;
          }
          const printWindow = window.open('', '_blank', 'width=800,height=900');
          if (!printWindow) { alert('No se pudo abrir la ventana de impresión. Verifica que las ventanas emergentes estén permitidas.'); return; }
          printWindow.document.write(`
            <!DOCTYPE html><html><head><meta charset="utf-8"><title>${title}</title>
            <style>
              body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 30px; color:#111; }
              h1 { font-size: 22px; border-bottom: 2px solid #333; padding-bottom: 8px; margin-bottom: 16px; }
              .meta { font-size: 11px; color: #666; margin-bottom: 20px; }
              .tags { font-size: 12px; color: #555; margin-top: 24px; border-top: 1px solid #ddd; padding-top: 10px; }
            </style></head><body>
            <h1>${title}</h1>
            <div class="meta">📅 ${new Date(note.createdAt || Date.now()).toLocaleString()}</div>
            ${bodyHtml}
            ${(note.tags && note.tags.length > 0) ? `<div class="tags">🏷️ ${note.tags.map(t => '#' + t).join(' ')}</div>` : ''}
            </body></html>
          `);
          printWindow.document.close();
          printWindow.focus();
          setTimeout(() => { printWindow.print(); }, 300);
        } catch (err) {
          console.error('Print error:', err);
          alert('Error al imprimir la nota: ' + (err.message || err));
        }
      };

      const changeFontSize = (delta) => {
        setEditingNote(prev => {
          if (!prev) return prev;
          const cur = prev.fontSize || 15;
          const next = Math.min(36, Math.max(11, cur + delta));
          return { ...prev, fontSize: next };
        });
      };

      const setSpecificFontSize = (sz) => { setEditingNote(prev => prev ? ({ ...prev, fontSize: sz }) : prev); };
      const setFontFamily = (ff) => { setEditingNote(prev => prev ? ({ ...prev, fontFamily: ff }) : prev); };

      const toggleFontWeight = () => {
        const ta = noteTextareaRef.current;
        if (ta && ta.selectionStart !== ta.selectionEnd) {
          const start = ta.selectionStart; const end = ta.selectionEnd;
          const text = editingNote.content || '';
          const selected = text.substring(start, end);
          const newText = text.substring(0, start) + `**${selected}**` + text.substring(end);
          setEditingNote(prev => prev ? ({ ...prev, content: newText }) : prev);
          setTimeout(() => { ta.focus(); ta.setSelectionRange(start + 2, end + 2); }, 40);
        } else setEditingNote(prev => prev ? ({ ...prev, fontWeight: prev.fontWeight === 'bold' ? 'normal' : 'bold' }) : prev);
      };

      const toggleFontStyle = () => {
        const ta = noteTextareaRef.current;
        if (ta && ta.selectionStart !== ta.selectionEnd) {
          const start = ta.selectionStart; const end = ta.selectionEnd;
          const text = editingNote.content || '';
          const selected = text.substring(start, end);
          const newText = text.substring(0, start) + `*${selected}*` + text.substring(end);
          setEditingNote(prev => prev ? ({ ...prev, content: newText }) : prev);
          setTimeout(() => { ta.focus(); ta.setSelectionRange(start + 1, end + 1); }, 40);
        } else setEditingNote(prev => prev ? ({ ...prev, fontStyle: prev.fontStyle === 'italic' ? 'normal' : 'italic' }) : prev);
      };

      const toggleTextDecoration = (type) => {
        const ta = noteTextareaRef.current;
        if (type === 'line-through' && ta && ta.selectionStart !== ta.selectionEnd) {
          const start = ta.selectionStart; const end = ta.selectionEnd;
          const text = editingNote.content || '';
          const selected = text.substring(start, end);
          const newText = text.substring(0, start) + `~~${selected}~~` + text.substring(end);
          setEditingNote(prev => prev ? ({ ...prev, content: newText }) : prev);
          setTimeout(() => { ta.focus(); ta.setSelectionRange(start + 2, end + 2); }, 40);
        } else {
          setEditingNote(prev => {
            if (!prev) return prev;
            const current = prev.textDecoration || 'none';
            const next = current === type ? 'none' : type;
            return { ...prev, textDecoration: next };
          });
        }
      };

      const setTextAlign = (align) => { setEditingNote(prev => prev ? ({ ...prev, textAlign: align }) : prev); };

      const toggleCaseTransform = () => {
        const ta = noteTextareaRef.current;
        if (ta && ta.selectionStart !== ta.selectionEnd) {
          const start = ta.selectionStart; const end = ta.selectionEnd;
          const text = editingNote.content || '';
          const selected = text.substring(start, end);
          const isUpper = selected === selected.toUpperCase();
          const transformed = isUpper ? selected.toLowerCase() : selected.toUpperCase();
          const newText = text.substring(0, start) + transformed + text.substring(end);
          setEditingNote(prev => prev ? ({ ...prev, content: newText }) : prev);
          setTimeout(() => { ta.focus(); ta.setSelectionRange(start, start + transformed.length); }, 40);
        } else {
          setEditingNote(prev => {
            if (!prev || !prev.content) return prev;
            const isUpper = prev.content === prev.content.toUpperCase();
            return { ...prev, content: isUpper ? prev.content.toLowerCase() : prev.content.toUpperCase() };
          });
        }
      };

      const insertTextSnippet = (snippet) => {
        const ta = noteTextareaRef.current;
        if (ta) {
          const start = ta.selectionStart || 0;
          const end = ta.selectionEnd || 0;
          const text = editingNote.content || '';
          const newText = text.substring(0, start) + snippet + text.substring(end);
          setEditingNote(prev => prev ? ({ ...prev, content: newText }) : prev);
          setTimeout(() => { ta.focus(); ta.setSelectionRange(start + snippet.length, start + snippet.length); }, 40);
        } else setEditingNote(prev => prev ? ({ ...prev, content: (prev.content || '') + snippet }) : prev);
      };

      useEffect(() => {
        const checkReminders = () => {
          const now = new Date();
          const todayStr = getLocalDateString(now);
          const timeStr = getLocalTimeString(now);
          notes.forEach(note => {
            if (note.inTrash || note.isArchived || !note.reminderDate || !note.reminderTime) return;
            const key = `${note.id}_${note.reminderDate}_${note.reminderTime}`;
            if (note.reminderDate === todayStr && note.reminderTime === timeStr && !firedRemindersRef.current.has(key)) {
              firedRemindersRef.current.add(key);
              setActiveReminderAlert(note);
              const noteTone = note.alarmTone || settings.alarmTone || 'classic';
              if (settings.enableSoundAlarm !== false) playReminderAlarmSound(noteTone);
              if ("Notification" in window && Notification.permission === "granted") {
                new Notification(`⏰ ${note.title || 'Recordatorio'}`, { body: note.content || '', tag: `cn-${note.id}` });
              }
              showToast(`⏰ ${note.title || 'Nota programada'}!`);
            }
          });
        };
        checkReminders();
        const interval = setInterval(checkReminders, 3000);
        return () => clearInterval(interval);
      }, [notes, settings.enableSoundAlarm, settings.alarmTone, showToast]);

      const handleOpenQuickReminder = (note) => {
        setQuickReminderNote(note);
        setQuickDateInput(note.reminderDate || getLocalDateString(new Date()));
        setQuickTimeInput(note.reminderTime || '12:00');
        setQuickRepeatInput(note.repeat || 'none');
        setQuickToneInput(note.alarmTone || settings.alarmTone || 'classic');
      };

      const handleSaveQuickReminder = () => {
        if (!quickReminderNote || !quickDateInput || !quickTimeInput) return;
        const selectedTone = quickToneInput || settings.alarmTone || 'classic';
        const updated = notes.map(n => n.id === quickReminderNote.id ? { ...n, reminderDate: quickDateInput, reminderTime: quickTimeInput, repeat: quickRepeatInput, alarmTone: selectedTone, updatedAt: Date.now() } : n);
        pushToRTDB(updated);
        if (editingNote && editingNote.id === quickReminderNote.id) {
          setEditingNote(prev => ({ ...prev, reminderDate: quickDateInput, reminderTime: quickTimeInput, repeat: quickRepeatInput, alarmTone: selectedTone }));
        }
        setQuickReminderNote(null);
        showToast(t('reminderScheduled'));
      };

      const handleRequestNotificationPermission = async () => {
        if (typeof Notification === 'undefined') { showToast(settings.language === 'en' ? 'Notifications are not supported in this browser' : 'Las notificaciones no son compatibles con este navegador'); return; }
        try {
          const perm = await Notification.requestPermission();
          setNotificationPermission(perm);
          if (perm === 'granted') showToast(settings.language === 'en' ? '🟢 Notifications Activated!' : '🟢 ¡Notificaciones Activadas!');
          else if (perm === 'denied') showToast(settings.language === 'en' ? 'Notifications blocked by browser' : 'Notificaciones bloqueadas en el navegador');
          else showToast(settings.language === 'en' ? 'Notification permission pending' : 'Permiso de notificaciones pendiente');
        } catch (e) { if (Notification.permission) setNotificationPermission(Notification.permission); }
      };

      const handleClearReminder = (noteId) => {
        const updated = notes.map(n => n.id === noteId ? { ...n, reminderDate: '', reminderTime: '', repeat: 'none', updatedAt: Date.now() } : n);
        pushToRTDB(updated);
        if (editingNote && editingNote.id === noteId) setEditingNote(prev => ({ ...prev, reminderDate: '', reminderTime: '', repeat: 'none' }));
        setQuickReminderNote(null);
        setActiveReminderAlert(null);
        showToast(t('reminderCancelled'));
      };

      const handleSnoozeReminder = (note, minutes = 10) => {
        stopContinuousAlarm();
        const now = new Date();
        const snoozed = new Date(now.getTime() + minutes * 60 * 1000);
        const nextDate = getLocalDateString(snoozed);
        const nextTime = getLocalTimeString(snoozed);
        const updated = notes.map(n => n.id === note.id ? { ...n, reminderDate: nextDate, reminderTime: nextTime, updatedAt: Date.now() } : n);
        pushToRTDB(updated);
        setActiveReminderAlert(null);
        showToast(`⏰ Alarma pospuesta ${minutes} min (${nextTime})`);
      };

      const handleDismissReminder = (note) => {
        stopContinuousAlarm();
        let updated;
        if (note.repeat && note.repeat !== 'none') {
          const parts = (note.reminderDate || getLocalDateString()).split('-');
          const next = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
          if (note.repeat === 'daily') next.setDate(next.getDate() + 1);
          else if (note.repeat === 'weekly') next.setDate(next.getDate() + 7);
          else if (note.repeat === 'monthly') next.setMonth(next.getMonth() + 1);
          updated = notes.map(n => n.id === note.id ? { ...n, reminderDate: getLocalDateString(next), updatedAt: Date.now() } : n);
        } else {
          updated = notes.map(n => n.id === note.id ? { ...n, reminderDate: '', reminderTime: '', updatedAt: Date.now() } : n);
        }
        pushToRTDB(updated);
        setActiveReminderAlert(null);
        showToast('🛑 Alarma apagada');
      };

      const calendarFilteredNotes = useMemo(() => {
        return notes.filter(n => {
          if (n.inTrash || n.isArchived) return false;
          if (calendarPrivacyFilter === 'private') return !n.isShared;
          if (calendarPrivacyFilter === 'shared') return !!n.isShared;
          return true;
        });
      }, [notes, calendarPrivacyFilter]);

      const handleCalendarDayClick = (dateStr) => {
        if (!dateStr) return;
        setSelectedDate(dateStr);
        const dayNotes = calendarFilteredNotes.filter(n => (n.reminderDate === dateStr || n.calendarDate === dateStr));
        const holiday = getHolidaysForDate(dateStr);
        const dayGroupEvents = groupEventsForDate(dateStr);
        setCalendarDetailDay({ dateStr, dayNotes, holiday, groupEvents: dayGroupEvents });
      };

      const monthGrid = useMemo(() => {
        const firstDay = new Date(calYear, calMonth, 1).getDay();
        const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
        const daysInPrev = new Date(calYear, calMonth, 0).getDate();
        const cells = [];
        for (let i = firstDay - 1; i >= 0; i--) {
          const d = daysInPrev - i;
          const prev = new Date(calYear, calMonth - 1, d);
          cells.push({ day: d, dateStr: getLocalDateString(prev), isCurrentMonth: false });
        }
        for (let d = 1; d <= daysInMonth; d++) {
          cells.push({ day: d, dateStr: `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`, isCurrentMonth: true });
        }
        const rem = (7 - (cells.length % 7)) % 7;
        for (let d = 1; d <= rem; d++) {
          const next = new Date(calYear, calMonth + 1, d);
          cells.push({ day: d, dateStr: getLocalDateString(next), isCurrentMonth: false });
        }
        return cells;
      }, [calYear, calMonth]);

      const weekDays = useMemo(() => {
        const [y, m, d] = (selectedDate || getLocalDateString()).split('-').map(Number);
        const start = new Date(y, m - 1, d);
        start.setDate(start.getDate() - start.getDay());
        return Array.from({ length: 7 }, (_, i) => {
          const dayDate = new Date(start);
          dayDate.setDate(dayDate.getDate() + i);
          return { date: dayDate, dateStr: getLocalDateString(dayDate) };
        });
      }, [selectedDate]);

      const notesForSelectedDate = useMemo(() =>
        calendarFilteredNotes.filter(n => (n.reminderDate === selectedDate || n.calendarDate === selectedDate)),
        [calendarFilteredNotes, selectedDate]
      );

      const upcomingReminders = useMemo(() => {
        const today = getLocalDateString(new Date());
        return calendarFilteredNotes.filter(n => ((n.reminderDate && n.reminderDate >= today) || (n.calendarDate && n.calendarDate >= today)))
          .sort((a, b) => {
            const da = a.reminderDate || a.calendarDate || '9999';
            const db = b.reminderDate || b.calendarDate || '9999';
            return (da + (a.reminderTime || '')).localeCompare(db + (b.reminderTime || ''));
          });
      }, [calendarFilteredNotes]);

      const getHolidaysForDate = (dateStr) => {
        if (!dateStr) return null;
        const parts = dateStr.split('-');
        if (parts.length !== 3) return null;
        const year = parseInt(parts[0], 10);
        const month = parseInt(parts[1], 10);
        const day = parseInt(parts[2], 10);
        const currentLang = settings.language || 'es';
        const list = getOfficialHolidaysForYear(year, currentLang);
        const matches = list.filter(h => h.month === month && h.day === day);
        if (matches.length === 0) return null;
        return {
          month, day,
          name: matches.map(h => `${h.flag ? h.flag + ' ' : ''}${h.name}`).join(' / '),
          emoji: matches[0].emoji || '🎉',

        let result = notes.filter(n => {

          if (specialFilter === 'favorites') return !n.isArchived && n.isFavorite;
          if (specialFilter === 'archived') return n.isArchived;
          if (specialFilter === 'pinned') return !n.isArchived && n.isPinned;
          if (specialFilter === 'reminders') return !n.isArchived && (Boolean(n.reminderDate) || Boolean(n.calendarDate));
          return !n.isArchived;

        if (colorFilter !== 'all') result = result.filter(n => n.color === colorFilter);
        if (tagFilter !== 'all') result = result.filter(n => (n.tags || []).includes(tagFilter));

            if (!cleanTextQuery) return true;
            const titleMatch = (n.title || '').toLowerCase().includes(cleanTextQuery);

            const checklistMatch = Array.isArray(n.checklist) && n.checklist.some(c => (c.text || '').toLowerCase().includes(cleanTextQuery));
            const generalTagMatch = (n.tags || []).some(t => t.toLowerCase().includes(cleanTextQuery));
            const createdFormatted = formatShortDateTime(n.createdAt).toLowerCase();

            const createdMatch = createdFormatted.includes(cleanTextQuery) || createdIso.includes(cleanTextQuery);
            const reminderMatch = (n.reminderDate || '').toLowerCase().includes(cleanTextQuery);
            const calendarMatch = (n.calendarDate || '').toLowerCase().includes(cleanTextQuery);
            return titleMatch || contentMatch || checklistMatch || generalTagMatch || createdMatch || reminderMatch || calendarMatch;

          if (sortOption === 'recent') return (b.updatedAt || 0) - (a.updatedAt || 0);
          if (sortOption === 'oldest') return (a.updatedAt || 0) - (b.updatedAt || 0);
          if (sortOption === 'title') return (a.title || '').localeCompare(b.title || '');
          if (sortOption === 'reminder') {

                              <div className="flex items-start justify-between gap-2">
                                <div className="flex items-center gap-1.5 min-w-0">
                                  <span className="text-xs shrink-0" title={n.isShared ? 'Compartido' : 'Privado'}>{n.isShared ? '👥' : '🔰'}</span>
                                  <span className="text-sm">{n.type === 'checklist' ? '☑️' : '📄'}</span>
                                  <h5 className="font-bold text-xs truncate" style={{ color: textColor }}>{n.title || t('untitled')}</h5>
                                </div>
                                {n.reminderTime && (<span className="shrink-0 text-[10px] font-mono font-bold px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-500 border border-emerald-500/30 flex items-center gap-1"><span>⏰</span><span>{n.reminderTime}</span></span>)}
                              </div>
                              <div className="text-xs opacity-90 whitespace-pre-wrap max-h-36 overflow-y-auto p-2 rounded-lg bg-black/5 dark:bg-white/5">
                                {n.type === 'checklist' ? (
                                  <div className="space-y-1">
                                    {(n.checklist || []).map((item, idx) => (
                                      <div key={idx} className="flex items-center gap-2">
                                        <span className={item.completed ? 'text-emerald-500 font-bold' : 'opacity-40'}>{item.completed ? '✓' : '○'}</span>
                                        <span className={item.completed ? 'line-through opacity-60' : ''}>{item.text || '...'}</span>
                                      </div>
                                    ))}
                                  </div>
                                ) : (<p className="leading-relaxed">{n.content || t('noContent')}</p>)}
                              </div>
                              <div className="flex items-center justify-end pt-1">
                                <button type="button" onClick={() => { setCalendarDetailDay(null); handleNoteClick(n); }} style={{ background: accentColor }} className="px-3 py-1.5 rounded-lg text-black font-bold text-xs flex items-center gap-1.5 hover:opacity-90 transition-opacity"><span>✏️</span><span>{t('openEdit')}</span></button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>

                <div className="pt-3 border-t border-black/10 dark:border-white/10 flex items-center justify-between gap-2 shrink-0">
                  <button type="button" onClick={() => { const d = calendarDetailDay.dateStr; setCalendarDetailDay(null); handleCreateNote('text', d); }} className="px-3 py-1.5 rounded-xl border border-emerald-500/40 bg-emerald-500/10 text-emerald-500 font-bold text-xs flex items-center gap-1 hover:bg-emerald-500/20 transition-colors"><span>{t('newNoteThisDay')}</span></button>
                  <button type="button" onClick={() => setCalendarDetailDay(null)} style={{ background: inputBg, borderColor }} className="px-4 py-1.5 rounded-xl border text-xs font-bold">{t('close')}</button>
                </div>
              </div>
            </div>
          )}

          {activeReminderAlert && (
            <div className="modal-overlay" style={{ zIndex: 140 }}>
              <div className="modal-card space-y-4 max-w-md w-full shadow-2xl border-2 rounded-2xl p-5" style={{ background: cardBg, borderColor: '#EF4444', color: textColor }}>
                <div className="flex items-start justify-between pb-2 border-b border-black/10 dark:border-white/10">
                  <div className="flex items-center gap-3">
                    <div className="w-12 h-12 rounded-2xl bg-red-500/20 text-red-500 flex items-center justify-center text-2xl animate-pulse">⏰</div>
                    <div>
                      <span className="text-[10px] font-bold tracking-wider uppercase text-red-500 block">{t('alarmTriggered')}</span>
                      <h3 className="font-bold text-base leading-tight">{activeReminderAlert.title || t('reminderAndAlarm')}</h3>
                    </div>
                  </div>
                  <button type="button" onClick={() => { stopContinuousAlarm(); setActiveReminderAlert(null); }} className="w-7 h-7 rounded-full flex items-center justify-center bg-black/5 dark:bg-white/10 hover:bg-black/10 text-xs font-bold opacity-75" title={t('close')}>✕</button>
                </div>

                <div className="p-3.5 rounded-xl border space-y-2" style={{ background: inputBg, borderColor: borderColor, borderLeft: `5px solid ${COLORS[activeReminderAlert.color]?.border || accentColor}` }}>
                  <div className="flex items-center justify-between text-[11px] opacity-75">
                    <span>📅 {formatReminderDateFriendly(activeReminderAlert.reminderDate, activeReminderAlert.reminderTime)}</span>
                    <span className="font-bold text-red-500 flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-red-500 animate-ping inline-block"></span>{t('ringingNow')}</span>
                  </div>
                  <p className="text-xs leading-relaxed line-clamp-3 whitespace-pre-wrap opacity-90">
                    {activeReminderAlert.isLocked ? t('contentProtected') : (activeReminderAlert.content || (activeReminderAlert.type === 'checklist' ? (activeReminderAlert.checklist || []).map(i => i.text).join(', ') : ''))}
                  </p>
                </div>

                <button type="button" onClick={() => { const note = activeReminderAlert; stopContinuousAlarm(); setActiveReminderAlert(null); handleNoteClick(note); }} style={{ background: inputBg, borderColor }} className="w-full py-2 rounded-xl border text-xs font-bold flex items-center justify-center gap-1.5 hover:bg-black/5 dark:hover:bg-white/5 transition-colors"><span>👁️</span><span>{t('viewEditNote')}</span></button>

                <div className="space-y-2.5 pt-1 border-t border-black/10 dark:border-white/10">
                  <button type="button" onClick={() => { stopContinuousAlarm(); handleDismissReminder(activeReminderAlert); }} className="w-full py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-sm shadow-md flex items-center justify-center gap-2 active:scale-98 transition-all cursor-pointer"><span>🛑</span><span>{t('turnOffAlarm')}</span></button>
                  <div className="p-2.5 rounded-xl border bg-amber-500/10 border-amber-500/30 space-y-2">
                    <div className="flex items-center justify-between text-xs font-bold text-amber-500 dark:text-amber-400">
                      <span className="flex items-center gap-1"><span>⏱️</span><span>{t('snoozeLabel')}</span></span>
                      <span className="text-[10px] font-normal opacity-80">{t('resoundIn')}</span>
                    </div>
                    <div className="grid grid-cols-3 gap-2 text-xs">
                      <button type="button" onClick={() => handleSnoozeReminder(activeReminderAlert, 5)} className="py-2 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-600 dark:text-amber-300 border border-amber-500/40 text-xs font-bold transition-all cursor-pointer">+5 min</button>
                      <button type="button" onClick={() => handleSnoozeReminder(activeReminderAlert, 10)} className="py-2 rounded-lg bg-amber-500 hover:bg-amber-600 text-black font-bold text-xs shadow-xs transition-all cursor-pointer">+10 min</button>
                      <button type="button" onClick={() => handleSnoozeReminder(activeReminderAlert, 15)} className="py-2 rounded-lg bg-amber-500/20 hover:bg-amber-500/30 text-amber-600 dark:text-amber-300 border border-amber-500/40 text-xs font-bold transition-all cursor-pointer">+15 min</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {showDrawingModal && (
            <div className="modal-overlay" style={{ zIndex: 140 }}>
              <div className="modal-card space-y-3 max-w-sm w-full" style={{ background: cardBg, borderColor, color: textColor }}>
                <div className="flex items-center justify-between pb-2 border-b border-black/10 dark:border-white/10">
                  <h3 className="font-bold text-sm">🎨 {t('drawing')}</h3>
                  <button onClick={() => setShowDrawingModal(false)} className="opacity-60 text-base">✕</button>
                </div>
                <div className="flex items-center justify-between gap-2 text-xs">
                  <div className="flex items-center gap-1.5">
                    {['#000000', '#EF4444', '#3B82F6', '#10B981', '#F59E0B', '#8B5CF6'].map(c => (
                      <button key={c} onClick={() => setDrawingColor(c)} style={{ background: c }} className={`w-5 h-5 rounded-full border border-black/20 ${drawingColor === c ? 'ring-2 ring-emerald-400 scale-125' : ''}`} />
                    ))}
                  </div>
                  <div className="flex items-center gap-1">
                    <button onClick={() => setDrawingLineWidth(2)} className={`px-2 py-0.5 rounded border text-[10px] ${drawingLineWidth === 2 ? 'bg-emerald-500 text-black font-bold' : ''}`}>{t('fine')}</button>
                    <button onClick={() => setDrawingLineWidth(5)} className={`px-2 py-0.5 rounded border text-[10px] ${drawingLineWidth === 5 ? 'bg-emerald-500 text-black font-bold' : ''}`}>{t('medium')}</button>
                    <button onClick={() => setDrawingLineWidth(10)} className={`px-2 py-0.5 rounded border text-[10px] ${drawingLineWidth === 10 ? 'bg-emerald-500 text-black font-bold' : ''}`}>{t('thick')}</button>
                  </div>
                </div>
                <canvas ref={drawingCanvasRef} width={340} height={280} onMouseDown={startDrawing} onMouseMove={drawMove} onMouseUp={stopDrawing} onMouseLeave={stopDrawing} onTouchStart={startDrawing} onTouchMove={drawMove} onTouchEnd={stopDrawing} className="rounded-xl border border-white/20 w-full cursor-crosshair bg-white" />
                <div className="flex gap-2">
                  <button onClick={() => { const canvas = drawingCanvasRef.current; const ctx = canvas.getContext('2d'); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); }} style={{ background: inputBg, borderColor }} className="px-3 py-2 rounded-xl border text-xs font-bold">{t('clear')}</button>
                  <button onClick={() => setShowDrawingModal(false)} style={{ background: inputBg, borderColor }} className="flex-1 py-2 rounded-xl border text-xs font-bold">{t('cancel')}</button>
                  <button onClick={saveDrawing} style={{ background: accentColor }} className="flex-1 py-2 rounded-xl text-black font-bold text-xs shadow">{t('save')}</button>
                </div>
              </div>
            </div>
          )}

          {lightboxImg && (
            <div className="modal-overlay" onClick={() => setLightboxImg(null)} style={{ zIndex: 160 }}>
              <div className="relative max-w-xl w-full p-2" onClick={e => e.stopPropagation()}>
                <img src={lightboxImg} alt="Ampliación" className="w-full max-h-[85vh] object-contain rounded-2xl shadow-2xl" />
                <button onClick={() => setLightboxImg(null)} className="absolute top-4 right-4 w-8 h-8 rounded-full bg-black/80 text-white font-bold flex items-center justify-center">✕</button>
              </div>
            </div>
          )}

          {driveConfirmModal && driveConfirmModal.isOpen && (
            <div className="modal-overlay" style={{ zIndex: 150 }}>
              <div className="modal-card space-y-4 max-w-md w-full shadow-2xl border-2" style={{ background: cardBg, borderColor: accentColor, color: textColor }}>
                <div className="flex items-center gap-3 pb-2 border-b border-black/10 dark:border-white/10">
                  <div className="w-10 h-10 rounded-2xl bg-blue-500/20 text-blue-400 flex items-center justify-center text-xl">{driveConfirmModal.type === 'restore' ? '📥' : '🔄'}</div>
                  <div>
                    <h3 className="font-bold text-sm leading-tight">{driveConfirmModal.title}</h3>
                    <span className="text-[10px] opacity-60">Google Drive API • NOTAS_DJ_Backup.json</span>
                  </div>
                </div>
                {driveConfirmModal.type === 'restore' && (
                  <div className="grid grid-cols-2 gap-2">
                    <div style={{ background: inputBg, borderColor }} className="p-2.5 rounded-xl border text-center">
                      <span className="text-[10px] opacity-60 block">{settings.language === 'en' ? 'Notes in cloud' : 'Notas en la nube'}</span>
                      <span className="text-base font-bold text-emerald-400 font-mono">{driveConfirmModal.notesCount ?? '—'}</span>
                    </div>
                    <div style={{ background: inputBg, borderColor }} className="p-2.5 rounded-xl border text-center">
                      <span className="text-[10px] opacity-60 block">{settings.language === 'en' ? 'File size' : 'Tamaño del archivo'}</span>
                      <span className="text-base font-bold text-blue-400 font-mono">{driveConfirmModal.fileSize ?? '—'}</span>
                    </div>
                  </div>
                )}
                <div className="p-3 bg-amber-500/10 border border-amber-500/25 rounded-xl space-y-1">
                  <div className="flex items-center gap-1.5 text-amber-400 text-xs font-bold"><span>⚠️</span><span>{t('overwriteWarning')}</span></div>
                  <p className="text-[11px] opacity-85 leading-snug">{driveConfirmModal.type === 'restore' ? (settings.language === 'en' ? 'Restoring will replace all your local content with the Google Drive backup.' : 'Al restaurar, se reemplazará todo tu contenido local con la copia de seguridad de Google Drive.') : (settings.language === 'en' ? 'A backup of your notes will be created or updated in your Google Drive account.' : 'Se creará o actualizará la copia de seguridad de tus notas en tu cuenta de Google Drive.')}</p>
                </div>
                <div className="flex gap-2 pt-1">
                  <button onClick={() => setDriveConfirmModal(null)} style={{ background: inputBg, borderColor }} className="flex-1 py-2.5 rounded-xl border text-xs font-bold opacity-80 hover:opacity-100 transition">{t('cancel')}</button>
                  <button onClick={driveConfirmModal.onConfirm} style={{ background: accentColor }} className="flex-1 py-2.5 rounded-xl text-black font-bold text-xs shadow hover:opacity-90 transition flex items-center justify-center gap-1.5">
                    <span>{driveConfirmModal.type === 'restore' ? '📥' : '💾'}</span>
                    <span>{driveConfirmModal.type === 'restore' ? t('confirmRestore') : t('confirmSave')}</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {customConfirmModal && customConfirmModal.isOpen && (
            <div className="modal-overlay" style={{ zIndex: 300 }} onClick={() => { if (customConfirmModal.onCancel) customConfirmModal.onCancel(); setCustomConfirmModal(null); }}>
              <div className="modal-card max-w-sm w-full space-y-4 shadow-2xl border-2 rounded-2xl p-5" style={{ background: cardBg, borderColor: customConfirmModal.isDanger ? '#EF4444' : accentColor, color: textColor }} onClick={(e) => e.stopPropagation()}>
                <div className="flex items-center justify-between pb-2.5 border-b border-black/10 dark:border-white/10">
                  <div className="flex items-center gap-2.5">
                    <div className={`w-9 h-9 rounded-xl flex items-center justify-center text-lg shadow-2xs ${customConfirmModal.isDanger ? 'bg-red-500/15 text-red-400 border border-red-500/30' : 'bg-amber-500/15 text-amber-400 border border-amber-500/30'}`}>{customConfirmModal.icon || '⚠️'}</div>
                    <div>
                      <h3 className="font-black text-sm tracking-wide" style={{ color: textColor }}>{customConfirmModal.title || 'SmartNote DJ'}</h3>
                      <span className="text-[10px] opacity-60">ColorNote Web Pro</span>
                    </div>
                  </div>
                  <button type="button" onClick={() => { if (customConfirmModal.onCancel) customConfirmModal.onCancel(); setCustomConfirmModal(null); }} className="w-7 h-7 rounded-lg flex items-center justify-center text-xs opacity-60 hover:opacity-100 hover:bg-black/10 dark:hover:bg-white/10 transition cursor-pointer">✕</button>
                </div>
                <div className="py-1">
                  <p className="text-xs sm:text-sm font-medium leading-relaxed" style={{ color: textColor }}>{customConfirmModal.message}</p>
                </div>
                <div className="flex gap-2.5 pt-2 border-t border-black/10 dark:border-white/10">
                  <button type="button" onClick={() => { if (customConfirmModal.onCancel) customConfirmModal.onCancel(); setCustomConfirmModal(null); }} style={{ background: inputBg, borderColor }} className="flex-1 py-2.5 px-3 rounded-xl border text-xs font-bold opacity-80 hover:opacity-100 active:scale-98 transition cursor-pointer">{customConfirmModal.cancelText || (settings.language === 'en' ? 'Cancel' : 'Cancelar')}</button>
                  <button type="button" onClick={() => { const onConfirmFn = customConfirmModal.onConfirm; setCustomConfirmModal(null); if (typeof onConfirmFn === 'function') onConfirmFn(); }} style={{ background: customConfirmModal.isDanger ? '#EF4444' : accentColor, color: customConfirmModal.isDanger ? '#FFFFFF' : '#000000' }} className="flex-1 py-2.5 px-3 rounded-xl font-bold text-xs shadow-md hover:opacity-95 active:scale-98 transition flex items-center justify-center gap-1.5 cursor-pointer">
                    <span>{customConfirmModal.confirmText || (settings.language === 'en' ? 'Confirm' : 'Confirmar')}</span>
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    try {
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
      console.log('✅ Aplicación montada correctamente');
    } catch (error) {
      document.getElementById('root').innerHTML = `
        <div style="padding:20px;color:#ef4444;background:#1a1a1a;border-radius:12px;margin:20px;border:1px solid #ef4444;">
          <h2>❌ Error al cargar la aplicación</h2>
          <p>${error.message}</p>
        </div>
      `;
      console.error('Error:', error);
    }
  </script>
</body>
</html>
